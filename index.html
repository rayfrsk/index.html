<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virt Casino</title>
    <!-- ✅ ИСПРАВЛЕНО: Правильный скрипт связи с Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff39c12;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 15px;
        }
        .card {
            width: 90px;
            height: 130px;
            background-color: #222235;
            border: 2px solid #33334c;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
            background-color: #2b2b45;
        }
        .card.active {
            background-color: #ff9f43;
            border-color: #ff9f43;
        }
    </style>
</head>
<body>

    <h1>VIRT CASINO 🎰</h1>
    <div class="subtitle">Угадай карту! Попытка: 5 Stars</div>

    <!-- Список карт с привязанной функцией клика selectCard() -->
    <div class="card-container">
        <div class="card" onclick="selectCard(1)">?</div>
        <div class="card" onclick="selectCard(2)">?</div>
        <div class="card" onclick="selectCard(3)">?</div>
    </div>

    <script>
        // Инициализируем связь с приложением Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем игру во весь экран

        // ✅ ЭТА ФУНКЦИЯ МАТЧИТ ФРОНТЕНД С БЭКЕНДОМ
        function selectCard(cardNumber) {
            // Визуально подсвечиваем кликнутую карту
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('active'));
            cards[cardNumber - 1].classList.add('active');

            // Моментально отправляем номер карты в Telegram, который передаст его бэкенду
            setTimeout(() => {
                tg.sendData(cardNumber.toString());
            }, 300);
        }
    </script>

</body>
</html>
