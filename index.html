<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Casino 🎰</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #f39c12;
            color: #f39c12;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 15px;
            width: 90%;
            justify-content: center;
        }
        .card {
            flex: 1;
            max-width: 100px;
            aspect-ratio: 3/4;
            background: linear-gradient(145deg, #2c2c3e, #1e1e2f);
            border: 2px solid #3d3d56;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:active {
            transform: scale(0.95);
            border-color: #f39c12;
        }
    </style>
</head>
<body>

    <h1>STARS CASINO 🎰</h1>
    <div class="subtitle">Угадай карту! Попытка: 5 Stars</div>

    <div class="card-container">
        <div class="card" onclick="playGame(1)">❓</div>
        <div class="card" onclick="playGame(2)">❓</div>
        <div class="card" onclick="playGame(3)">❓</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function playGame(cardNumber) {
            // Передаем боту номер выбранной карты (например, "card_2")
            tg.sendData("card_" + cardNumber);
            // Закрываем Web App, чтобы юзер сразу увидел инвойс на оплату в чате
            tg.close();
        }
    </script>
</body>
</html>
