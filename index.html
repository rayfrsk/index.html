<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virt Casino 🎰</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #f39c12;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 15px;
            width: 90%;
            justify-content: center;
        }
        .card {
            flex: 1;
            max-width: 100px;
            aspect-ratio: 3/4;
            background: linear-gradient(145deg, #2c2c3e, #1e1e2f);
            border: 2px solid #3d3d56;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
        }
        /* Анимация клика и смена цвета карточки */
        .card:active {
            transform: scale(0.95);
        }
        .card.selected {
            border-color: #f39c12;
            background: #f39c12;
        }
    </style>
</head>
<body>

    <h1>VIRT CASINO 🎰</h1>
    <div class="subtitle">Угадай карту! Попытка: 5 Stars</div>

    <div class="card-container">
        <div class="card" id="c1" onclick="buyCard(1)">❓</div>
        <div class="card" id="c2" onclick="buyCard(2)">❓</div>
        <div class="card" id="c3" onclick="buyCard(3)">❓</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function buyCard(num) {
            // 1. Карточка ТУТ ЖЕ меняет цвет на оранжевый при клике
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            document.getElementById('c' + num).classList.add('selected');

            // 2. Вместо отправки данных, мы просто закрываем приложение через полсекунды,
            // чтобы под ним сразу открылся инвойс, который пришлет бот.
            setTimeout(() => {
                tg.close();
            }, 300);
            
            // Чтобы бот узнал, какую карту мы выбрали, мы позже свяжем это через бэкенд.
        }
    </script>
</body>
</html>
