<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Casino 🎰</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #f39c12;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 15px;
            width: 90%;
            justify-content: center;
        }
        .card {
            flex: 1;
            max-width: 100px;
            aspect-ratio: 3/4;
            background: linear-gradient(145deg, #2c2c3e, #1e1e2f);
            border: 2px solid #3d3d56;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
        }
        /* Включается при клике на карту */
        .card.selected {
            border-color: #f39c12;
            background: #f39c12;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>STARS CASINO 🎰</h1>
    <div class="subtitle">Выбери карту. Ставка: 5 Stars</div>

    <div class="card-container">
        <div class="card" id="c1" onclick="selectCard(1)">❓</div>
        <div class="card" id="c2" onclick="selectCard(2)">❓</div>
        <div class="card" id="c3" onclick="selectCard(3)">❓</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedNumber = null;

        function selectCard(num) {
            selectedNumber = num;
            
            // Сбрасываем выделение со всех карт и красим выбранную
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            document.getElementById('c' + num).classList.add('selected');

            // Выкатываем большую нижнюю кнопку Телеграма
            tg.MainButton.text = СТАВКА НА КАРТУ №${num} (5 ⭐️);
            tg.MainButton.show();
        }

        // Клик по большой нижней кнопке
        tg.MainButton.onClick(() => {
            if (selectedNumber) {
                tg.sendData("card_" + selectedNumber); 
                tg.close();
            }
        });
    </script>
</body>
</html>
